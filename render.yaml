services:
  # ----------------------------------------------------------------------------
  # Backend Server Web Service (100% Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: blastup-server
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info

  # ----------------------------------------------------------------------------
  # Frontend Client Web Service (100% Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: blastup-client
    env: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
